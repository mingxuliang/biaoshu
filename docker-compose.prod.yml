# 生产部署：对外只暴露 8010（前端 + /api 反代）。
# 本机 8000 已被其他容器占用，Postgres/Redis/MinIO 不映射到宿主机。
# 启动：docker compose -f docker-compose.prod.yml up -d --build
# backend/.env 必须设置：APP_ENV=prod、随机 SECRET_KEY、REDIS_PASSWORD（并同步 REDIS_URL）、
# MINIO_ROOT_USER / MINIO_ROOT_PASSWORD（与 MINIO_ACCESS_KEY / MINIO_SECRET_KEY 一致）、WRITER_BROWSER_TOKEN。
# 可选 MinerU：docker compose -f docker-compose.prod.yml --profile mineru up -d，并设置 MINERU_URL=http://mineru:8000。

name: zhibiaoyun

services:
  postgres:
    image: postgres:16-alpine
    env_file: backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file: backend/.env
    command: ["sh", "-c", "if [ -n \"$$REDIS_PASSWORD\" ]; then exec redis-server --requirepass \"$$REDIS_PASSWORD\"; else exec redis-server; fi"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file: backend/.env
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 8s
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/sample_data:/app/sample_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      MINERU_URL: http://mineru:8000
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: backend/.env
    # -B 内嵌 beat 跑平台定时任务（关超时订单、积分到期、余额提醒）；worker 多副本时改成单独的 beat 服务
    command: celery -A app.celery_app worker -B --schedule /tmp/celerybeat-schedule --loglevel=info --concurrency=2
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/sample_data:/app/sample_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      MINERU_URL: http://mineru:8000
    restart: unless-stopped

  # 撰写页版式预览：常驻 LibreOffice，把导出的 docx 渲染成 PDF。只在内网被 backend/worker 访问。
  lo:
    build: ./backend/lo
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  mineru:
    build: ./backend/mineru
    image: zhibiaoyun-mineru:cpu
    environment:
      MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-modelscope}
      MINERU_DEVICE_MODE: cpu
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "8010:80"
    volumes:
      - ./out:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  minio_data:
