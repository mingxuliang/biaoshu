<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Word 里的中文字体名 -> 开源替代字体。
  用 <default> 追加在原名后面：服务器上有真字体（放进 lo/fonts/）时优先用真字体，没有才用替代。
  汉字都是等宽，替代字体与 Word 字体的换行、分页基本一致，只是字形不同。
-->
<fontconfig>
  <!-- 宋体、仿宋、小标宋：思源宋体 -->
  <alias><family>宋体</family><default><family>Noto Serif CJK SC</family></default></alias>
  <alias><family>SimSun</family><default><family>Noto Serif CJK SC</family></default></alias>
  <alias><family>NSimSun</family><default><family>Noto Serif CJK SC</family></default></alias>
  <alias><family>新宋体</family><default><family>Noto Serif CJK SC</family></default></alias>
  <alias><family>仿宋</family><default><family>Noto Serif CJK SC</family></default></alias>
  <alias><family>FangSong</family><default><family>Noto Serif CJK SC</family></default></alias>
  <alias><family>仿宋_GB2312</family><default><family>Noto Serif CJK SC</family></default></alias>
  <alias><family>FangSong_GB2312</family><default><family>Noto Serif CJK SC</family></default></alias>
  <alias><family>方正仿宋_GBK</family><default><family>Noto Serif CJK SC</family></default></alias>
  <alias><family>方正仿宋简体</family><default><family>Noto Serif CJK SC</family></default></alias>
  <alias><family>华文仿宋</family><default><family>Noto Serif CJK SC</family></default></alias>
  <alias><family>华文中宋</family><default><family>Noto Serif CJK SC</family></default></alias>
  <alias><family>方正小标宋简体</family><default><family>Noto Serif CJK SC</family></default></alias>
  <alias><family>方正小标宋_GBK</family><default><family>Noto Serif CJK SC</family></default></alias>
  <alias><family>方正书宋_GBK</family><default><family>Noto Serif CJK SC</family></default></alias>

  <!-- 黑体、雅黑、等线：思源黑体 -->
  <alias><family>黑体</family><default><family>Noto Sans CJK SC</family></default></alias>
  <alias><family>SimHei</family><default><family>Noto Sans CJK SC</family></default></alias>
  <alias><family>微软雅黑</family><default><family>Noto Sans CJK SC</family></default></alias>
  <alias><family>Microsoft YaHei</family><default><family>Noto Sans CJK SC</family></default></alias>
  <alias><family>等线</family><default><family>Noto Sans CJK SC</family></default></alias>
  <alias><family>DengXian</family><default><family>Noto Sans CJK SC</family></default></alias>
  <alias><family>方正黑体_GBK</family><default><family>Noto Sans CJK SC</family></default></alias>
  <alias><family>华文细黑</family><default><family>Noto Sans CJK SC</family></default></alias>

  <!-- 楷体：文鼎 PL 简中楷 -->
  <alias><family>楷体</family><default><family>AR PL UKai CN</family></default></alias>
  <alias><family>KaiTi</family><default><family>AR PL UKai CN</family></default></alias>
  <alias><family>楷体_GB2312</family><default><family>AR PL UKai CN</family></default></alias>
  <alias><family>KaiTi_GB2312</family><default><family>AR PL UKai CN</family></default></alias>
  <alias><family>华文楷体</family><default><family>AR PL UKai CN</family></default></alias>
  <alias><family>方正楷体_GBK</family><default><family>AR PL UKai CN</family></default></alias>

  <!-- 西文：Times New Roman、Arial、Calibri、Cambria 由系统自带的度量兼容别名处理 -->
  <alias><family>Courier New</family><default><family>Liberation Mono</family></default></alias>
</fontconfig>
